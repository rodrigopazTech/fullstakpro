version: "3.8"

services:
  # ============================================
  # POSTGRES con pgvector
  # ============================================
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-rodrigo_db_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=main_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rodrigo_db_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - services-network

  # ============================================
  # REDIS
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --port 6379 --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - services-network

  # ============================================
  # N8N - UI y webhooks
  # ============================================
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_main
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-rodrigo_db_admin}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - QUEUE_TYPE=redis
      - QUEUE_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - N8N_EXECUTIONS_MODE=queue
      - N8N_HOST=${N8N_HOST:-0.0.0.0}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=America/Mexico_City
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - WEBHOOK_URL=http://${SERVER_IP}:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - services-network

  # ============================================
  # N8N Worker
  # ============================================
  n8n_worker:
    image: n8nio/n8n:latest
    container_name: n8n_worker_1
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-rodrigo_db_admin}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - QUEUE_TYPE=redis
      - QUEUE_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - N8N_EXECUTIONS_MODE=worker
      - GENERIC_TIMEZONE=America/Mexico_City
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_started
    networks:
      - services-network

  # ============================================
  # OPENWA API
  # Nota: usa host network para evitar el bloqueo visto con bridge.
  # ============================================
  openwa_api:
    build:
      context: ../open-wa
      dockerfile: Dockerfile
    container_name: openwa-api
    network_mode: host
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=2785
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_TYPE=sqlite
      - DATABASE_NAME=/app/data/openwa.sqlite
      - ENGINE_TYPE=whatsapp-web.js
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=${PUPPETEER_HEADLESS:-true}
      - PUPPETEER_ARGS=${PUPPETEER_ARGS:---no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu}
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - REDIS_ENABLED=false
      - WEBHOOK_TIMEOUT=${OPENWA_WEBHOOK_TIMEOUT:-10000}
      - WEBHOOK_MAX_RETRIES=${OPENWA_WEBHOOK_MAX_RETRIES:-3}
      - WEBHOOK_RETRY_DELAY=${OPENWA_WEBHOOK_RETRY_DELAY:-5000}
      - RATE_LIMIT_TTL=${OPENWA_RATE_LIMIT_TTL:-60}
      - RATE_LIMIT_MAX=${OPENWA_RATE_LIMIT_MAX:-100}
      - PLUGINS_ENABLED=${OPENWA_PLUGINS_ENABLED:-true}
      - PLUGINS_DIR=/app/data/plugins
      - API_MASTER_KEY=${OPENWA_API_KEY}
    volumes:
      - openwa_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../open-wa/docker-compose.yml:/app/docker-compose.yml:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:2785/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================
  # Proxy interno para que n8n alcance OpenWA
  # ============================================
  openwa_api_proxy:
    image: alpine/socat:latest
    container_name: openwa_api_proxy
    restart: always
    command: TCP-LISTEN:2785,fork,reuseaddr TCP4:172.19.0.1:2785
    networks:
      - services-network

  # ============================================
  # OpenWA Dashboard
  # ============================================
  openwa_dashboard:
    build:
      context: ../open-wa/dashboard
      dockerfile: Dockerfile.traefik
    container_name: openwa-dashboard
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "80"
    depends_on:
      - openwa_api
    networks:
      - services-network

  # ============================================
  # Traefik para exponer el dashboard de OpenWA
  # ============================================
  openwa_traefik:
    image: traefik:v3.0
    container_name: openwa-traefik
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-2886}:80"
      - "127.0.0.1:${TRAEFIK_PORT:-8080}:8080"
    volumes:
      - ../open-wa/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../open-wa/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - openwa_dashboard
    networks:
      - services-network

  # ============================================
  # OLLAMA
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    environment:
      - HTTPS_PROXY=${OLLAMA_HTTPS_PROXY:-}
      - NO_PROXY=${OLLAMA_NO_PROXY:-localhost,127.0.0.1,ollama,postgres,redis,n8n,n8n_main,n8n_worker_1}
      - OLLAMA_MODELS=/root/.ollama
    extra_hosts:
      - "registry.ollama.ai:104.21.75.227"
      - "ollama.com:34.36.133.15"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - services-network

  # ============================================
  # CHATWOOT
  # ============================================
  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: chatwoot
    restart: always
    ports:
      - "3000:3000"
    environment:
      - FRONTEND_URL=http://${SERVER_IP}:3000
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - DEFAULT_LOCALE=es
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=${POSTGRES_USER:-rodrigo_db_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=chatwoot_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY}
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL:-noreply@localhost}
      - SMTP_DOMAIN=${SMTP_DOMAIN:-localhost}
      - SMTP_ADDRESS=${SMTP_ADDRESS:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_AUTHENTICATION=plain
      - SMTP_ENABLE_STARTTLS_AUTO=true
    command: ["sh", "-c", "rm -f /app/tmp/pids/server.pid && bundle exec rails s -p 3000 -b 0.0.0.0"]
    volumes:
      - chatwoot_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - services-network

  # ============================================
  # CHATWOOT Worker
  # ============================================
  chatwoot_worker:
    image: chatwoot/chatwoot:latest
    container_name: chatwoot_worker
    restart: always
    environment:
      - FRONTEND_URL=http://${SERVER_IP}:3000
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - DEFAULT_LOCALE=es
      - POSTGRES_HOST=postgres
      - POSTGRES_USERNAME=${POSTGRES_USER:-rodrigo_db_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=chatwoot_production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY}
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL:-noreply@localhost}
      - SMTP_DOMAIN=${SMTP_DOMAIN:-localhost}
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - services-network

  # ============================================
  # PORTAINER
  # ============================================
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9000:9000"
    networks:
      - services-network

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  n8n_data:
  openwa_data:
  chatwoot_data:
  portainer_data:

networks:
  services-network:
    driver: bridge
