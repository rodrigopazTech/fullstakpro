services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_lite
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin_pass
      - POSTGRES_DB=evolution_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_lite_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis_lite
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_lite
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=lite_key_123
      # Configuración de base de datos
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://admin:admin_pass@postgres:5432/evolution_db
      # Redis
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - CACHE_REDIS_PREFIX_KEY=lite_evo
      # Desactivar integraciones complejas para la prueba
      - CHATWOOT_ENABLED=false
    depends_on:
      - postgres
      - redis

volumes:
  postgres_lite_data:
